[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-dl"
version = "2.5.1"
description = "Personal multi-cloud download, torrent, and resilient sync CLI for AWS and OCI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anurup R Krishnan" }]
requires-python = ">=3.12"
keywords = ["cli", "aria2", "rsync", "aws", "oci", "torrent", "cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/Anurup-R-Krishnan/cloud-dl"
Repository = "https://github.com/Anurup-R-Krishnan/cloud-dl"
Issues = "https://github.com/Anurup-R-Krishnan/cloud-dl/issues"

[project.scripts]
cloud-dl = "cloud_dl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM",
    "RUF", "RET", "PT", "PERF", "BLE",
    "PLW1510", "S110", "C901",
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
